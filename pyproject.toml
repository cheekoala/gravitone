[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gravitone"
version = "1.0.0"
description = "Your own soundtrack for any game: your music, with silence or weather between the songs"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
classifiers = [
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Sound/Audio :: Players",
]

[project.scripts]
gravitone = "gravitone.cli:main"
# Nine letters is a lot to type a hundred times a day.
grav = "gravitone.cli:main"

[project.urls]
Homepage = "https://github.com/cheekoala/custom_bg_game_soundtrack_player"

[tool.setuptools]
packages = ["gravitone"]

[tool.setuptools.package-data]
gravitone = ["ui/*"]
